name: Cloud egress probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe from ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe YouTube audio path
        continue-on-error: true
        run: npm run probe -- M7lc1UVf-VE --clients ANDROID_VR,IOS --seconds 3 --output output
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ runner.os }}
          path: output/*.json
          if-no-files-found: warn
